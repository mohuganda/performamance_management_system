version: '3.8'

services:
  moh-pms-pwa:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moh_pms_pwa_gateway
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - BACKEND_API_SERVER=${BACKEND_API_SERVER:-http://127.0.0.1:8081}
      - BACKEND_API_HOST=${BACKEND_API_HOST:-127.0.0.1:8081}
