events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    server {
        listen 80;
        server_name localhost;

        # Root directory for PWA build assets
        root /usr/share/nginx/html;
        index index.html;

        # 1. API Reverse Proxy: All /api/ calls route directly to the MoH backend server
        location /api/ {
            proxy_pass http://45.10.154.35:8081/api/;
            proxy_http_version 1.1;

            # Rewrite Host header to target backend host
            proxy_set_header Host 45.10.154.35:8081;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Strip origin to avoid CORS preflight rejections by backend
            proxy_set_header Origin "";
            proxy_set_header Referer "";

            # Add permissive CORS headers just in case
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Accept" always;

            # Preflight response
            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # 2. PWA Static Assets & HTML5 History Mode Routing
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        # 3. Static Assets Caching (JS, CSS, Images, Fonts)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # 4. Service Worker & Manifest (Must not be aggressively cached)
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location = /manifest.webmanifest {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
